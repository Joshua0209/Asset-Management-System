# Grafana CloudWatch datasource (Phase 6, W6 milestone M6).
#
# Surfaces ECS Container Insights + ALB metrics from the deployed AMS service
# alongside the local Prometheus panels in the same Grafana. Authenticated as
# the read-only `ams-grafana-reader` IAM user — see
# docs/system-design/08-deployment-operations.md § "Observability stack: CloudWatch reader".
#
# Locked decisions (docs/plans/observability-implementation-plan.md § Phase 6):
#   - Long-lived IAM user, NOT OIDC federation (one credential to rotate, no
#     assume-role refresh shim in Grafana).
#
# Keys are delivered via docker compose secrets, NOT plain env vars: the
# compose overlay sources CLOUDWATCH_ACCESS_KEY / CLOUDWATCH_SECRET_KEY from
# the host .env into tmpfs files under /run/secrets/ inside the grafana
# container. `$__file{...}` is Grafana's file-expansion syntax (≥7.3); the
# values never appear in `docker inspect grafana`'s Env block. If the secret
# files don't exist (operator left the env vars empty), Grafana logs a warning
# and substitutes empty strings — the datasource still provisions, only the
# two CloudWatch panels render "No data".

apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch
    access: proxy
    editable: false
    jsonData:
      authType: keys
      defaultRegion: ap-east-2
    secureJsonData:
      accessKey: $__file{/run/secrets/cloudwatch_access_key}
      secretKey: $__file{/run/secrets/cloudwatch_secret_key}
