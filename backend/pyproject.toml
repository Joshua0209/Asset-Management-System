[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-management-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for the Asset Management System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "bcrypt>=4.1,<5.0",
  "email-validator>=2.1,<3.0",
  # 0.136.3 excluded: MAL-2026-4750 — upstream's [standard] extra silently
  # pulls an undocumented `fastar` typosquat dep. We install .[prod] not
  # .[standard] so actual exposure is nil, but pip-audit can't tell which
  # extras get installed downstream, so it blocks the build on any resolve
  # to 0.136.3. Drop this exclusion once upstream yanks or releases a fix.
  "fastapi>=0.115,!=0.136.3,<1.0",
  # Observability — OTLP-native (W6 Phase 3 of the prod migration plan).
  # All three signals (traces, metrics, logs) push direct to Grafana Cloud's
  # OTLP gateway; the local Alloy collector is gone. See
  # docs/plans/observability-prod-migration-plan.md § Phase 3.
  #
  # opentelemetry-instrumentation-logging bridges the stdlib `logging`
  # module (which structlog routes through) into the OTel logs SDK so a
  # single `LoggingHandler` carries every structlog event over OTLP.
  "opentelemetry-api>=1.27,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0",
  "opentelemetry-instrumentation-logging>=0.48b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1.0",
  "opentelemetry-sdk>=1.27,<2.0",
  "pydantic-settings>=2.2,<3.0",
  "pyjwt>=2.9,<3.0",
  "pymysql>=1.1,<2.0",
  "slowapi>=0.1.9,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "structlog>=24.1,<26.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  # pymysql needs cryptography for MySQL 8's caching_sha2_password auth
  # (the default auth plugin). Only required when test_migration_schema_drift
  # talks to a real MySQL via TEST_MYSQL_URL; SQLite tests do not need it.
  "cryptography>=42,<46",
  "httpx>=0.27,<1.0",
  # OpenAPI contract validation in test_api_contract.py.
  "jsonschema>=4,<5",
  # First-party stubs for the line above. Not strictly needed today —
  # CI's `mypy app` (not `mypy tests`) does not import jsonschema, and
  # the project-wide `ignore_missing_imports = true` would suppress the
  # error if it did. Kept explicit so IDE tooling and any future move
  # to a stricter typing posture (`mypy tests`, or
  # `ignore_missing_imports = false`) keep working without surprise.
  "types-jsonschema>=4,<5",
  "mypy>=1.10,<2.0",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-xdist>=3.6,<4.0",
  "ruff>=0.5,<1.0",
]
# Production-only runtime extras. Kept separate from `dev` so the prod
# Docker image can install `.[prod]` without pulling pytest/mypy/ruff.
# gunicorn supervises uvicorn workers — it's what handles SIGTERM cleanly
# during ECS rolling deploys.
prod = [
  "gunicorn>=22.0,<24.0",
  "boto3>=1.34,<2.0",
  # Continuous profiling, opt-in via PYROSCOPE_ENABLED=true. Lazy-imported in
  # app.core.observability so the dev image does not need it. Enabled in the
  # ECS task definition as well — `WEB_CONCURRENCY=1` plus no
  # `gunicorn --preload` means the sampling thread starts inside the worker
  # post-fork (see docs/plans/observability-prod-migration-plan.md locked
  # decision 5). >=0.8.5 required for the `basic_auth_username` /
  # `auth_token` kwargs that target Grafana Cloud's hosted Pyroscope.
  "pyroscope-io>=0.8.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = []
strict = true
ignore_missing_imports = true
