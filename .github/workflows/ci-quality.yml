name: CI quality

# Reusable workflow that runs every quality and security gate the project
# enforces: lint, typecheck, unit/integration tests, security baseline
# (secrets, SAST, SCA), SonarQube quality gate, dashboards validation, and
# the Playwright E2E suite. Called from ci.yml (PR + feature pushes) and
# from cd.yml (main pushes + manual dispatch) so the same checks gate
# review and deploy without duplication.
#
# Outputs the path-filter booleans + docs_only flag so callers can branch
# their own deploy / dispatch logic on what actually changed.
on:
  workflow_call:
    outputs:
      backend:
        description: Whether backend paths changed in this run.
        value: ${{ jobs.changes.outputs.backend }}
      alembic:
        description: Whether a new Alembic migration file landed in this run.
        value: ${{ jobs.changes.outputs.alembic }}
      frontend:
        description: Whether frontend paths changed in this run.
        value: ${{ jobs.changes.outputs.frontend }}
      dashboards:
        description: Whether Grafana Cloud dashboard JSONs changed.
        value: ${{ jobs.changes.outputs.dashboards }}
      docs_only:
        description: True when none of the code/dashboard filters matched.
        value: ${{ jobs.changes.outputs.docs_only }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # Single gate for the whole event-type matrix. Downstream test/security
    # jobs `needs: changes` so they inherit this filter implicitly - no need
    # to repeat the same `github.event_name == ...` clause on every job.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    outputs:
      backend: ${{ steps.aggregate.outputs.backend }}
      alembic: ${{ steps.aggregate.outputs.alembic }}
      frontend: ${{ steps.aggregate.outputs.frontend }}
      dashboards: ${{ steps.aggregate.outputs.dashboards }}
      # True when none of the code-side filters fired. Used downstream to
      # skip backend-test / frontend-test / sonarqube on docs-only PRs.
      # Security baseline (secrets, sast) keeps running unconditionally
      # because a markdown snippet can still leak a secret and we want
      # the same coverage on docs-only PRs.
      docs_only: ${{ steps.aggregate.outputs.docs_only }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          # Each filter includes the workflow + composite-action paths so
          # CI-only changes still trigger the full pipeline. backend-task-def
          # and frontend-task-def changes route to the matching service's
          # jobs (they affect runtime config and need to be redeployed).
          filters: |
            backend:
              - 'backend/**'
              - 'infra/ecs/backend-task-def.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            # Narrower filter than `backend`: only fires when a new
            # migration is added under backend/alembic/versions/**. The
            # `migrate-database` deploy step is gated on this so a
            # backend-code-only change skips the ~1m14s Fargate run-task
            # launch (alembic upgrade head no-ops if the chain is at
            # head, but the task launch overhead is real). Migration env/
            # config changes (alembic.ini, env.py) still go through
            # `backend` because they can affect how migrations run.
            alembic:
              - 'backend/alembic/versions/**'
            frontend:
              - 'frontend/**'
              - 'infra/ecs/frontend-task-def.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            dashboards:
              - 'config/grafana/dashboards/**'
              - 'scripts/sync_grafana_cloud_dashboards.py'
              - '.github/workflows/ci.yml'
      - name: Aggregate outputs (workflow_dispatch forces everything)
        id: aggregate
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          ALEMBIC: ${{ steps.filter.outputs.alembic }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          DASHBOARDS: ${{ steps.filter.outputs.dashboards }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "alembic=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "dashboards=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${BACKEND}" >> "$GITHUB_OUTPUT"
            echo "alembic=${ALEMBIC}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FRONTEND}" >> "$GITHUB_OUTPUT"
            echo "dashboards=${DASHBOARDS}" >> "$GITHUB_OUTPUT"
            # docs_only when none of the code filters fired. The dorny
            # action emits the literal string "false" for unmatched
            # filters, so a string compare is safe.
            if [ "$BACKEND" = "false" ] && [ "$FRONTEND" = "false" ] && [ "$DASHBOARDS" = "false" ]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  backend-lint:
    name: Backend - ruff
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Cache ruff
        # Ruff's incremental cache speeds up reruns on near-identical code
        # (typical PR push churn). Restore-keys lets a partial hit survive
        # source changes; ruff invalidates per-file internally.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: backend/.ruff_cache
          key: ruff-${{ runner.os }}-py3.11-${{ hashFiles('backend/**/*.py') }}
          restore-keys: |
            ruff-${{ runner.os }}-py3.11-
      - name: Install ruff only
        # Lint job does not need the full app or test deps - just ruff.
        # `pip install .[dev]` would pull ~80 packages we never invoke here.
        # Version range mirrors backend/pyproject.toml [dev] so CI and the
        # local pre-commit hook resolve the same ruff release.
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.5,<1.0'
      - name: Ruff lint
        run: ruff check .

  backend-typecheck:
    name: Backend - mypy strict
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          # uv keeps a content-addressed wheel store under ~/.cache/uv;
          # enabling the cache hashes the dep manifest below so warm runs
          # reuse it across jobs and across PRs. cuts pip install -e '.[dev]'
          # from ~15-20s (pip wheel cache) to ~3-5s.
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Cache mypy
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-py3.11-${{ hashFiles('backend/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.11-
      - name: Install backend (with dev extras)
        # mypy --strict needs the full installed package + stubs to resolve
        # third-party types (SQLAlchemy, FastAPI, etc.). uv pip install
        # --system writes to the setup-python interpreter, mirroring what
        # plain `pip install` would do but ~5x faster.
        run: uv pip install --system -e '.[dev]'
      - name: Mypy strict
        run: mypy app

  backend-test:
    # 2-way matrix shard via pytest-split. The previous single job took
    # ~2m40s on a typical PR (the dominant critical path before SonarQube
    # could start). Two shards cut wall-clock to ~1m20s each because the
    # runner's 4 vCPUs already saturate one shard's pytest-xdist workers,
    # so doubling the workers via a matrix gives near-linear speedup.
    # Coverage is merged downstream in `backend-coverage-merge` before
    # being handed to SonarQube.
    name: Backend - pytest + coverage (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: changes
    # Skip on docs-only PRs - coverage hasn't changed, so re-publishing to
    # SonarQube would just re-emit the previous result. The cost-per-run
    # saved (~80s/shard) compounds across the 2-3 docs PRs/week we ship.
    # On main pushes that ARE docs-only the same logic applies: no code
    # changed, no coverage delta, no new SonarQube data point.
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    strategy:
      # One shard's flake should not mask the other's; we want both
      # diagnostic outputs side by side. SonarQube downstream still
      # requires both shards green via `backend-coverage-merge`, so a
      # single shard failure still blocks the merge gate.
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: backend
    # MySQL 8 service for tests/test_migration_schema_drift.py. The test
    # cannot run against SQLite (the migration chain uses ALTER COLUMN
    # TYPE, which SQLite does not implement) and is the only defence
    # against the "ORM model added without a matching migration" bug
    # class that only explodes on real MySQL. Without this service block
    # the test silently `pytest.skip`s in CI and the gate is fictional.
    #
    # MySQL runs on BOTH shards because pytest-split distributes tests by
    # recorded duration, so the migration drift test could land in either
    # shard run to run. Adding the service to both adds no critical-path
    # time (parallel matrix jobs each get their own runner + container)
    # and avoids a brittle "predict which shard hosts the MySQL test" rule.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: amstest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Install backend (with dev extras)
        run: uv pip install --system -e '.[dev]'
      - name: Restore pytest-split durations cache
        # pytest-split reads `.test_durations` to balance shards by recorded
        # wall-clock. On a cold cache it falls back to splitting by test
        # count, which can produce 1.5x skew on a real suite. `--store-
        # durations` below refreshes the file so the next run starts hot.
        # `restore-keys` lets a partial hit survive new tests being added.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: backend/.test_durations
          key: pytest-durations-${{ runner.os }}-py3.11-${{ hashFiles('backend/tests/**/*.py') }}
          restore-keys: |
            pytest-durations-${{ runner.os }}-py3.11-
      - name: Pytest with coverage (shard ${{ matrix.shard }}/2)
        # pytest-split (--splits 2 --group N) slices the collected test list
        # into 2 balanced groups by recorded duration; pytest-xdist (-n auto
        # --dist=loadfile) then parallelises within the slice. Order matters:
        # pytest-split must see the full collection before xdist distributes,
        # so its flags come first.
        #
        # --cov-context records context per test so the downstream
        # `coverage combine` produces a consistent merged dataset rather
        # than the last-writer-wins overwrite that comes from two raw
        # .coverage files. --store-durations writes/updates .test_durations
        # so the next run's shard distribution is better balanced.
        #
        # COVERAGE_FILE puts each shard's raw coverage data in its own
        # file so the artifacts uploaded below don't collide; the merge
        # job (`backend-coverage-merge`) combines them into one
        # `coverage.xml` for SonarQube.
        env:
          TEST_MYSQL_URL: mysql+pymysql://root:rootpass@127.0.0.1:3306
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: |
          pytest \
            --splits 2 --group ${{ matrix.shard }} \
            --store-durations --durations-path .test_durations \
            -n auto --dist=loadfile \
            --cov=app --cov-report=term
      - name: Upload partial coverage data
        # Raw .coverage.N files (not XML) so the merge job downstream can
        # call `coverage combine` to produce a single canonical dataset
        # before exporting XML for SonarQube. include-hidden-files=true
        # because actions/upload-artifact@v4 silently drops dotfiles by
        # default and our coverage files all start with a dot.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage-data-${{ matrix.shard }}
          path: backend/.coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload refreshed test durations
        # Both shards write the same merged file (pytest-split's --store-
        # durations is idempotent across shards within a run); the cache
        # action above reads it back on the next run. Per-shard artifact
        # names avoid the v4 upload-artifact same-name-conflict error.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pytest-durations-${{ matrix.shard }}
          path: backend/.test_durations
          if-no-files-found: ignore

  backend-coverage-merge:
    # Combine the two shard coverage artifacts into a single coverage.xml
    # that SonarQube can ingest. Without this step SonarQube would only
    # see whichever shard happened to upload last (artifact-name collision)
    # or, with the per-shard naming used above, neither - because the
    # downstream `sonarqube` job hardcodes `name: backend-coverage`.
    #
    # Coverage combine runs in seconds; the wall-clock cost is dwarfed by
    # the time it saves on the critical path (the shards finish ~80s
    # faster than the un-sharded job did).
    name: Backend - coverage merge
    runs-on: ubuntu-latest
    needs: backend-test
    if: ${{ !cancelled() && needs.backend-test.result == 'success' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install coverage tooling
        # Only `coverage[toml]` is needed for the combine + xml export.
        # The full backend install would take 20-30s for no benefit.
        run: uv pip install --system 'coverage[toml]>=7,<8'
      - name: Download shard coverage data
        # Both .coverage.1 and .coverage.2 land in the same directory so
        # `coverage combine` can pick them up by glob. The merge operation
        # discards the .coverage.N files once .coverage exists.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backend-coverage-data-*
          merge-multiple: true
          path: backend/
      - name: Merge and export coverage.xml
        # `coverage combine` reads .coverage.* siblings into one .coverage
        # dataset (additive across files, deduped on (file, line)); `xml`
        # then writes the SonarQube-compatible report.
        run: |
          coverage combine .coverage.*
          coverage xml -o coverage.xml
          coverage report --skip-empty || true
      - name: Upload merged coverage
        # Keep the artifact name SonarQube already expects (`backend-coverage`)
        # so the downstream job doesn't need a rename.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend-test:
    name: Frontend - vitest + coverage
    runs-on: ubuntu-latest
    needs: changes
    # Skip on docs-only PRs - see backend-test for the same rationale.
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache node_modules
        # Shared cache key with the `frontend` job below - both install
        # the same lockfile-pinned tree, so a hit in one warms the other.
        # See `frontend` for the full rationale on the key composition.
        id: node-modules-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-node22-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install dependencies
        if: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
        run: npm ci
      - name: Vitest with coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  frontend:
    name: Frontend (eslint + tsc + build)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache node_modules
        # setup-node's `cache: npm` only caches ~/.npm (download tarballs);
        # `npm ci` still re-extracts the full tree every run. Caching the
        # resolved tree skips `npm ci` entirely on a lockfile-exact hit.
        # No restore-keys on purpose - a partial hit could mix incompatible
        # transitive versions and silently break the build.
        #
        # ImageOS / ImageVersion are set by GitHub-hosted runners (e.g.
        # ImageOS=ubuntu22). Including them invalidates the cache when GH
        # rolls a new runner image, so native binaries built by postinstall
        # scripts (esbuild, @swc/core, etc.) cannot survive an OS bump and
        # silently produce ABI-mismatched .so files on a hit.
        id: node-modules-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-node22-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install dependencies
        if: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Security baseline - runs on every PR + main push + workflow_dispatch
    # regardless of paths. A docs-only change can still leak a secret in a
    # markdown snippet, and the deploy gate accepts `skipped` as not-failure,
    # so this job must NEVER skip when build-and-push could fire.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history. gitleaks-action diff-scans by event type, but a
          # shallow clone can silently truncate the scan range on PRs with
          # long-lived branches (>N commits since merge-base). The runtime
          # cost is small vs. the cost of missing a leak that was committed
          # 101+ commits ago and later amended out of the visible diff.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (semgrep OWASP top-10)
    runs-on: ubuntu-latest
    # Security baseline - keep unconditional like secrets, including
    # workflow_dispatch (the deploy gate treats `skipped` as not-failure).
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Semgrep
        # Switched from the `semgrep/semgrep` container image to pip-install
        # on the host runner so actions/cache works. The official image is
        # Alpine/musl and the cache action requires glibc-compatible Node.
        run: pip install semgrep==1.160.0
      - name: Compute ISO week bucket
        # `p/owasp-top-ten` is a remote ruleset that updates on the Semgrep
        # registry independently of the pinned engine version. Without a
        # time component the cache would serve stale rules indefinitely.
        # An ISO year+week bucket gives a hard refresh every 7 days while
        # still letting same-week reruns hit the cache.
        id: semgrep-bucket
        run: echo "iso_week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Semgrep rules
        # Cache key bumps automatically when the semgrep version in the
        # install step above changes, AND once per ISO week so the upstream
        # OWASP-top-10 ruleset cannot stay frozen for more than 7 days.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.semgrep
            ~/.cache/semgrep
          key: semgrep-1.160.0-${{ runner.os }}-${{ steps.semgrep-bucket.outputs.iso_week }}
          restore-keys: |
            semgrep-1.160.0-${{ runner.os }}-
      - name: Semgrep
        run: semgrep scan --config p/owasp-top-ten --error

  pip-audit:
    name: SCA - Python (pip-audit)
    runs-on: ubuntu-latest
    needs: changes
    # SCA jobs (pip-audit, npm-audit, trivy) are path-filter gated even
    # though they are security checks - unlike secrets/sast which run
    # unconditionally. Rationale: a docs-only commit cannot introduce a
    # new CVE into the production dependency closure, because lockfiles
    # (`backend/pyproject.toml`, `frontend/package-lock.json`) live under
    # `backend/**` and `frontend/**` respectively. Any dep upgrade that
    # could land a CVE necessarily flips the matching filter and re-runs
    # the audit. Secrets/SAST scan source content (including markdown), so
    # they cannot be path-filtered without losing coverage.
    if: ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Install runtime deps
        # Audit only the prod dependency closure - dev tools (pytest, mypy,
        # ruff) never ship to production, so their CVEs would be noise here.
        # The audit action runs in `pip list` mode when `inputs` is omitted,
        # so install the same extras as Dockerfile.prod into an isolated venv.
        # uv venv + uv pip install replaces python -m venv + pip install,
        # both for speed (~5x) and so the cached wheel store is shared with
        # backend-test/typecheck above (same uv cache key family).
        run: |
          # --seed installs pip/setuptools/wheel into the venv. Without it
          # uv-created venvs are pip-less (saves ~10 MB), but the downstream
          # pypa/gh-action-pip-audit calls `python -m pip` against the venv's
          # python and fails with "No module named pip". --seed makes the
          # venv behave like `python -m venv` while keeping uv's speed.
          uv venv --seed .audit-venv
          uv pip install --python .audit-venv/bin/python -e '.[prod]'
      - name: pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          virtual-environment: backend/.audit-venv
          # PYSEC-2025-183: pyjwt "weak encryption" advisory, DISPUTED by
          # the PyJWT maintainers and has no fix version. The cited risk
          # (short/weak signing key) is the application's choice, not the
          # library's. Mitigated by generating production JWT_SECRET with
          # `python3 -c 'import secrets; print(secrets.token_urlsafe(48))'`
          # (>=32 bytes random) and stored in AWS Secrets Manager.
          # Tracked in #69 - revisit when upstream publishes a fix version
          # or when PyJWT is upgraded to >=3.x.
          ignore-vulns: |
            PYSEC-2025-183

  npm-audit:
    name: SCA - Node (npm audit)
    runs-on: ubuntu-latest
    needs: changes
    # See pip-audit for the rationale on path-filtering an SCA job.
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: npm audit (production deps, high+)
        # --omit=dev mirrors what the production image installs.
        # --audit-level=high blocks HIGH and CRITICAL only; MEDIUM/LOW
        # advisories would be constant noise without a security trade-off.
        run: npm audit --omit=dev --audit-level=high

  trivy:
    name: SCA - Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: changes
    # Trivy reads the lockfiles + Dockerfiles directly; runs when either
    # side changes. Replaces OWASP Dependency-Check, which was 5-10 min
    # slower due to the NVD database download. See pip-audit for the
    # rationale on path-filtering an SCA job.
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Trivy filesystem scan (HIGH + CRITICAL)
        # CVSS 7+ = HIGH/CRITICAL severity, matching the gates used by
        # pip-audit (--audit-level=high) and the old dependency-check
        # (--failOnCVSS 7). Trivy reads pyproject.toml + package-lock.json
        # directly, so it covers the same dependency tree as the per-language
        # audits plus OS packages from Dockerfiles.
        #
        # NO ignore-unfixed: true. OWASP DC blocked on every HIGH/CRITICAL
        # regardless of patch status; Trivy will do the same. Unpatched
        # advisories require explicit suppression with audit notes (mirror
        # the per-CVE allowlist pattern that pip-audit uses for PYSEC-2025-183
        # above) rather than a blanket bypass that grows silently as new
        # zero-days drop before fixes are available.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  sonarqube:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    needs: [changes, backend-coverage-merge, frontend-test]
    # Runs on every event the `changes` gate admits (PR / main push /
    # workflow_dispatch). The two test jobs above are path-filter free, so
    # SonarQube always sees both coverage artifacts and the project-wide
    # coverage trend cannot be distorted by a missing side.
    if: ${{ !cancelled() && needs.backend-coverage-merge.result == 'success' && needs.frontend-test.result == 'success' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Download backend coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-coverage
          path: backend
      - name: Download frontend coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Cache SonarQube analyzers
        # The scanner downloads ~50 MB of language analyzers + JRE on a
        # cold run. Analyzer versions are pinned by the scanner action SHA
        # below; the short-SHA prefix in the cache key bumps the cache
        # automatically when that pin is upgraded so stale analyzers from
        # the previous scanner release cannot be served against a newer
        # engine.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-fd88b7d7
          restore-keys: |
            sonar-${{ runner.os }}-
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # Path-filtered CI gate for the Grafana Cloud dashboard JSONs. Runs on
  # every PR + main push when dashboards change so a malformed dashboard
  # (missing `uid`, invalid JSON) is caught before the real sync below.
  dashboards-validate:
    name: Dashboards - dry-run sync
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.dashboards == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Dry-run dashboard sync (parse + validate, no HTTP)
        run: python scripts/sync_grafana_cloud_dashboards.py --dry-run

  # Playwright browser-driven regression suite (25 tests across 16 specs)
  # against a real FastAPI + MySQL stack. The unit tests mock `@/api`, so
  # the only line of defence against contract drift (BE/FE OpenAPI shape
  # divergence) is this job. Gated on docs_only=false + at least one of
  # backend/frontend changing - a config/grafana-only change does not need
  # browser coverage. Blocks `build-and-push` so a failing E2E cannot
  # ship to ECS.
  e2e:
    name: E2E - Playwright (chromium)
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend-typecheck]
    # The needs chain (`frontend`, `backend-typecheck`) is path-filtered, so
    # !cancelled() is required to let e2e run when frontend was correctly
    # skipped on a backend-only change (and vice versa). The explicit
    # docs_only + per-side check below keeps e2e from firing on docs-only
    # or dashboards-only PRs.
    if: |
      !cancelled() &&
      needs.changes.outputs.docs_only != 'true' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: asset_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      # Inline env mirrors backend/.env.example minus observability + minus
      # the things the host actually overrides at runtime (DB host, ports).
      # Kept short on purpose - if pydantic-settings needs a field that is
      # not here, the test will surface it loudly on first run.
      DATABASE_URL: mysql+pymysql://root:password@127.0.0.1:3306/asset_management
      JWT_SECRET: e2e-fixed-secret-not-used-elsewhere-and-not-deployed
      BOOTSTRAP_MANAGER_EMAIL: admin@example.com
      BOOTSTRAP_MANAGER_PASSWORD: ChangeMe123
      BOOTSTRAP_MANAGER_NAME: Bootstrap Manager
      BOOTSTRAP_MANAGER_DEPARTMENT: IT
      # /tmp is wiped between jobs; the repair-image directory lives there
      # because Playwright's repair-submit spec uploads a 1x1 PNG fixture
      # and the backend needs a writeable upload root.
      REPAIR_UPLOAD_DIR: /tmp/repair-uploads
      # Telemetry off - the suite cares about API contracts, not traces,
      # and OTLP exporters would spam timeouts without credentials.
      OTEL_ENABLED: "false"
      PYROSCOPE_ENABLED: "false"
      # Rate limiting off so the rapid-fire E2E auth calls do not 429.
      # Other rate-limit fields stay at .env.example defaults via
      # pydantic-settings.
      RATE_LIMIT_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      CORS_ALLOWED_METHODS: '["GET","POST","PATCH","OPTIONS"]'
      CORS_ALLOWED_HEADERS: '["Authorization","Content-Type"]'
      # Vite reads VITE_API_BASE_URL at dev-server startup. localhost:8000
      # because uvicorn binds to 127.0.0.1 on the host below.
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install backend (dev extras for uvicorn + alembic + seed)
        working-directory: backend
        run: uv pip install --system -e '.[dev]'

      - name: Apply migrations + seed demo data
        # The Playwright fixtures (e2e/fixtures/auth.ts) hardcode the
        # bootstrap manager credentials and well-known seeded asset codes
        # (AST-2026-00007, -00013, -00050). Without the seed those assertions
        # have nothing to act on. AMS_SEED_CONFIRM=1 is the in-script safety
        # gate; CI is exactly the controlled env it's designed for.
        working-directory: backend
        env:
          AMS_SEED_CONFIRM: "1"
        run: |
          alembic upgrade head
          python scripts/seed_demo_data.py

      - name: Start backend (uvicorn, background)
        working-directory: backend
        run: |
          mkdir -p /tmp/repair-uploads
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend /ready
        # /ready exercises a `SELECT 1` against MySQL, which is exactly
        # what we want here - it confirms both uvicorn AND the DB-side of
        # the stack are reachable. 60s budget covers Python import warm-up
        # on a cold runner. Tail backend.log on failure so a crash on boot
        # is visible without re-running with verbose logging.
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ready; then
              echo
              echo "Backend ready after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become ready in 60s. Tail of backend.log:"
          tail -200 /tmp/backend.log || true
          exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache node_modules
        # Share the cache-key shape with `frontend` / `frontend-test` so a
        # warm cache from either of them is reusable here. See `frontend`
        # for the full rationale on ImageOS/ImageVersion in the key.
        id: node-modules-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-node22-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        # ~/.cache/ms-playwright holds the chromium binary (~300 MB).
        # Keyed on @playwright/test's resolved version so an SDK bump
        # invalidates the cache - browser binaries are SDK-version-pinned.
        id: playwright-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        # Always run with --with-deps to ensure the system-level Chromium
        # dependencies (libnss3 etc.) are installed even on a cache hit.
        # The browser-binary download is a no-op when the binary is already
        # at the expected path.
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        # apt-get bits still need to be installed when the binary cache hit
        # spared us the full --with-deps install above.
        if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run E2E suite
        # Playwright's webServer config in e2e/playwright.config.ts starts
        # `npm run dev` (Vite) automatically and waits for the URL to be up
        # before the first test. `workers: 1` on CI keeps specs serial so
        # they do not race the single shared backend DB.
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run test:e2e

      - name: Tail backend log on failure
        if: failure()
        run: |
          echo '---- backend.log ----'
          tail -300 /tmp/backend.log || true

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright traces/screenshots/video
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

      - name: Stop backend
        # Cleanup on every exit so a leaked PID does not poison subsequent
        # debugging steps. `kill || true` since the process may have already
        # crashed.
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          fi

  # ci-complete is the single required status check for branch protection.
  # The historical pattern of marking every individual job as required has
  # two problems: (1) docs-only PRs now skip several quality jobs (see
  # `docs_only` on the changes job), and required status checks treat
  # `skipped` as not-pass; (2) renaming or restructuring a job rolls the
  # required-check name and silently leaves merges unguarded until repo
  # settings catch up. A single ci-complete gate side-steps both: it
  # always runs, depends on every quality job, and fails iff any of them
  # actually failed (not merely skipped).
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - changes
      - backend-lint
      - backend-typecheck
      - backend-test
      - backend-coverage-merge
      - frontend
      - frontend-test
      - e2e
      - secrets
      - sast
      - pip-audit
      - npm-audit
      - trivy
      - sonarqube
      - dashboards-validate
    steps:
      - name: Aggregate quality results
        # Echoes each upstream job's status to the log for at-a-glance
        # diagnosis, then fails the gate if any need is failure/cancelled.
        # `skipped` is treated as pass (the job's own if: filter decided
        # the work wasn't needed - which is the whole point of docs_only
        # and path filters).
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -E '"result"\s*:\s*"(failure|cancelled)"' >/dev/null; then
            echo "::error::One or more upstream quality jobs failed or were cancelled."
            exit 1
          fi
          echo "All upstream quality jobs passed (or were skipped by their own gates)."

