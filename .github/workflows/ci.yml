name: CI

# Thin caller of the reusable quality workflow. Fires only on pull
# request events (opened, synchronize, reopened, ready_for_review),
# so reviewers see lint/typecheck/test/security/E2E status on every
# push to a PR branch but raw feature-branch pushes without a PR do
# not burn runner minutes. Pushes to main are handled by cd.yml,
# which runs the same reusable workflow plus the deploy chain.
#
# Branch protection: require the single "CI / quality / CI complete"
# check on PRs into main; individual quality jobs still appear as
# diagnostic checks but are not required (they are treated as pass
# when correctly skipped by their own `if:` filters).
on:
  pull_request:
    branches: ["**"]

concurrency:
  # New pushes to a PR branch cancel in-flight CI - fast feedback
  # wins over the marginal info value of a stale, soon-to-be-
  # superseded run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/ci-quality.yml
    secrets: inherit
