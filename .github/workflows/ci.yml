name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Manual rollout path for hot-fixes that need a re-deploy without a new
  # commit. Gated by the same `if:` on the deploy jobs below.
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Run demo data seeding (WARNING: deletes ALL data)'
        required: false
        default: false
        type: boolean
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR / feature pushes cancel older runs for fast feedback. Pushes to
  # main do NOT cancel - if two main commits queue, the older one might
  # be a security patch mid-deploy and we want it to finish before the
  # newer one starts (matches the intent of the deploy jobs'
  # `cancel-in-progress: false`).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # Pinned at workflow level so build-and-push and the downstream ECS
  # render jobs all reference the same image tag for this run.
  IMAGE_TAG: sha-${{ github.sha }}
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # Single gate for the whole event-type matrix. Downstream test/security
    # jobs `needs: changes` so they inherit this filter implicitly - no need
    # to repeat the same `github.event_name == ...` clause on every job.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    outputs:
      backend: ${{ steps.aggregate.outputs.backend }}
      frontend: ${{ steps.aggregate.outputs.frontend }}
      dashboards: ${{ steps.aggregate.outputs.dashboards }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          # Each filter includes the workflow + composite-action paths so
          # CI-only changes still trigger the full pipeline. backend-task-def
          # and frontend-task-def changes route to the matching service's
          # jobs (they affect runtime config and need to be redeployed).
          filters: |
            backend:
              - 'backend/**'
              - 'infra/ecs/backend-task-def.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            frontend:
              - 'frontend/**'
              - 'infra/ecs/frontend-task-def.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            dashboards:
              - 'config/grafana/dashboards/**'
              - 'scripts/sync_grafana_cloud_dashboards.py'
              - '.github/workflows/ci.yml'
      - name: Aggregate outputs (workflow_dispatch forces everything)
        id: aggregate
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          DASHBOARDS: ${{ steps.filter.outputs.dashboards }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "dashboards=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${BACKEND}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FRONTEND}" >> "$GITHUB_OUTPUT"
            echo "dashboards=${DASHBOARDS}" >> "$GITHUB_OUTPUT"
          fi

  backend-lint:
    name: Backend - ruff
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Cache ruff
        # Ruff's incremental cache speeds up reruns on near-identical code
        # (typical PR push churn). Restore-keys lets a partial hit survive
        # source changes; ruff invalidates per-file internally.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: backend/.ruff_cache
          key: ruff-${{ runner.os }}-py3.11-${{ hashFiles('backend/**/*.py') }}
          restore-keys: |
            ruff-${{ runner.os }}-py3.11-
      - name: Install ruff only
        # Lint job does not need the full app or test deps - just ruff.
        # `pip install .[dev]` would pull ~80 packages we never invoke here.
        # Version range mirrors backend/pyproject.toml [dev] so CI and the
        # local pre-commit hook resolve the same ruff release.
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.5,<1.0'
      - name: Ruff lint
        run: ruff check .

  backend-typecheck:
    name: Backend - mypy strict
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Cache mypy
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-py3.11-${{ hashFiles('backend/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.11-
      - name: Install backend (with dev extras)
        # mypy --strict needs the full installed package + stubs to resolve
        # third-party types (SQLAlchemy, FastAPI, etc.).
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Mypy strict
        run: mypy app

  backend-test:
    # 2-way matrix shard via pytest-split. The previous single job took
    # ~2m40s on a typical PR (the dominant critical path before SonarQube
    # could start). Two shards cut wall-clock to ~1m20s each because the
    # runner's 4 vCPUs already saturate one shard's pytest-xdist workers,
    # so doubling the workers via a matrix gives near-linear speedup.
    # Coverage is merged downstream in `backend-coverage-merge` before
    # being handed to SonarQube.
    name: Backend - pytest + coverage (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: changes
    # No path filter: pytest+coverage runs on every PR / main push so the
    # SonarQube job downstream always sees a backend coverage artifact.
    # Skipping this on docs-only PRs would also skip SonarQube (which needs
    # both coverage files to avoid distorting the project-wide trend), and
    # we want SonarQube's quality gate to evaluate every change.
    strategy:
      # One shard's flake should not mask the other's; we want both
      # diagnostic outputs side by side. SonarQube downstream still
      # requires both shards green via `backend-coverage-merge`, so a
      # single shard failure still blocks the merge gate.
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: backend
    # MySQL 8 service for tests/test_migration_schema_drift.py. The test
    # cannot run against SQLite (the migration chain uses ALTER COLUMN
    # TYPE, which SQLite does not implement) and is the only defence
    # against the "ORM model added without a matching migration" bug
    # class that only explodes on real MySQL. Without this service block
    # the test silently `pytest.skip`s in CI and the gate is fictional.
    #
    # MySQL runs on BOTH shards because pytest-split distributes tests by
    # recorded duration, so the migration drift test could land in either
    # shard run to run. Adding the service to both adds no critical-path
    # time (parallel matrix jobs each get their own runner + container)
    # and avoids a brittle "predict which shard hosts the MySQL test" rule.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: amstest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Restore pytest-split durations cache
        # pytest-split reads `.test_durations` to balance shards by recorded
        # wall-clock. On a cold cache it falls back to splitting by test
        # count, which can produce 1.5x skew on a real suite. `--store-
        # durations` below refreshes the file so the next run starts hot.
        # `restore-keys` lets a partial hit survive new tests being added.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: backend/.test_durations
          key: pytest-durations-${{ runner.os }}-py3.11-${{ hashFiles('backend/tests/**/*.py') }}
          restore-keys: |
            pytest-durations-${{ runner.os }}-py3.11-
      - name: Pytest with coverage (shard ${{ matrix.shard }}/2)
        # pytest-split (--splits 2 --group N) slices the collected test list
        # into 2 balanced groups by recorded duration; pytest-xdist (-n auto
        # --dist=loadfile) then parallelises within the slice. Order matters:
        # pytest-split must see the full collection before xdist distributes,
        # so its flags come first.
        #
        # --cov-context records context per test so the downstream
        # `coverage combine` produces a consistent merged dataset rather
        # than the last-writer-wins overwrite that comes from two raw
        # .coverage files. --store-durations writes/updates .test_durations
        # so the next run's shard distribution is better balanced.
        #
        # COVERAGE_FILE puts each shard's raw coverage data in its own
        # file so the artifacts uploaded below don't collide; the merge
        # job (`backend-coverage-merge`) combines them into one
        # `coverage.xml` for SonarQube.
        env:
          TEST_MYSQL_URL: mysql+pymysql://root:rootpass@127.0.0.1:3306
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: |
          pytest \
            --splits 2 --group ${{ matrix.shard }} \
            --store-durations --durations-path .test_durations \
            -n auto --dist=loadfile \
            --cov=app --cov-report=term
      - name: Upload partial coverage data
        # Raw .coverage.N files (not XML) so the merge job downstream can
        # call `coverage combine` to produce a single canonical dataset
        # before exporting XML for SonarQube. include-hidden-files=true
        # because actions/upload-artifact@v4 silently drops dotfiles by
        # default and our coverage files all start with a dot.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage-data-${{ matrix.shard }}
          path: backend/.coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload refreshed test durations
        # Both shards write the same merged file (pytest-split's --store-
        # durations is idempotent across shards within a run); the cache
        # action above reads it back on the next run. Per-shard artifact
        # names avoid the v4 upload-artifact same-name-conflict error.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pytest-durations-${{ matrix.shard }}
          path: backend/.test_durations
          if-no-files-found: ignore

  backend-coverage-merge:
    # Combine the two shard coverage artifacts into a single coverage.xml
    # that SonarQube can ingest. Without this step SonarQube would only
    # see whichever shard happened to upload last (artifact-name collision)
    # or, with the per-shard naming used above, neither - because the
    # downstream `sonarqube` job hardcodes `name: backend-coverage`.
    #
    # Coverage combine runs in seconds; the wall-clock cost is dwarfed by
    # the time it saves on the critical path (the shards finish ~80s
    # faster than the un-sharded job did).
    name: Backend - coverage merge
    runs-on: ubuntu-latest
    needs: backend-test
    if: ${{ !cancelled() && needs.backend-test.result == 'success' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install coverage tooling
        # Only `coverage[toml]` is needed for the combine + xml export.
        # The full backend install would take 20-30s for no benefit.
        run: |
          python -m pip install --upgrade pip
          pip install 'coverage[toml]>=7,<8'
      - name: Download shard coverage data
        # Both .coverage.1 and .coverage.2 land in the same directory so
        # `coverage combine` can pick them up by glob. The merge operation
        # discards the .coverage.N files once .coverage exists.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backend-coverage-data-*
          merge-multiple: true
          path: backend/
      - name: Merge and export coverage.xml
        # `coverage combine` reads .coverage.* siblings into one .coverage
        # dataset (additive across files, deduped on (file, line)); `xml`
        # then writes the SonarQube-compatible report.
        run: |
          coverage combine .coverage.*
          coverage xml -o coverage.xml
          coverage report --skip-empty || true
      - name: Upload merged coverage
        # Keep the artifact name SonarQube already expects (`backend-coverage`)
        # so the downstream job doesn't need a rename.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend-test:
    name: Frontend - vitest + coverage
    runs-on: ubuntu-latest
    needs: changes
    # No path filter: see backend-test for the same rationale. The two
    # test jobs run unconditionally so SonarQube downstream always has
    # both coverage files and never has to publish a partial trend.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache node_modules
        # Shared cache key with the `frontend` job below - both install
        # the same lockfile-pinned tree, so a hit in one warms the other.
        # See `frontend` for the full rationale on the key composition.
        id: node-modules-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-node22-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install dependencies
        if: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
        run: npm ci
      - name: Vitest with coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  frontend:
    name: Frontend (eslint + tsc + build)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache node_modules
        # setup-node's `cache: npm` only caches ~/.npm (download tarballs);
        # `npm ci` still re-extracts the full tree every run. Caching the
        # resolved tree skips `npm ci` entirely on a lockfile-exact hit.
        # No restore-keys on purpose - a partial hit could mix incompatible
        # transitive versions and silently break the build.
        #
        # ImageOS / ImageVersion are set by GitHub-hosted runners (e.g.
        # ImageOS=ubuntu22). Including them invalidates the cache when GH
        # rolls a new runner image, so native binaries built by postinstall
        # scripts (esbuild, @swc/core, etc.) cannot survive an OS bump and
        # silently produce ABI-mismatched .so files on a hit.
        id: node-modules-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-node22-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install dependencies
        if: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Security baseline - runs on every PR + main push + workflow_dispatch
    # regardless of paths. A docs-only change can still leak a secret in a
    # markdown snippet, and the deploy gate accepts `skipped` as not-failure,
    # so this job must NEVER skip when build-and-push could fire.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history. gitleaks-action diff-scans by event type, but a
          # shallow clone can silently truncate the scan range on PRs with
          # long-lived branches (>N commits since merge-base). The runtime
          # cost is small vs. the cost of missing a leak that was committed
          # 101+ commits ago and later amended out of the visible diff.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (semgrep OWASP top-10)
    runs-on: ubuntu-latest
    # Security baseline - keep unconditional like secrets, including
    # workflow_dispatch (the deploy gate treats `skipped` as not-failure).
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Semgrep
        # Switched from the `semgrep/semgrep` container image to pip-install
        # on the host runner so actions/cache works. The official image is
        # Alpine/musl and the cache action requires glibc-compatible Node.
        run: pip install semgrep==1.160.0
      - name: Compute ISO week bucket
        # `p/owasp-top-ten` is a remote ruleset that updates on the Semgrep
        # registry independently of the pinned engine version. Without a
        # time component the cache would serve stale rules indefinitely.
        # An ISO year+week bucket gives a hard refresh every 7 days while
        # still letting same-week reruns hit the cache.
        id: semgrep-bucket
        run: echo "iso_week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Semgrep rules
        # Cache key bumps automatically when the semgrep version in the
        # install step above changes, AND once per ISO week so the upstream
        # OWASP-top-10 ruleset cannot stay frozen for more than 7 days.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.semgrep
            ~/.cache/semgrep
          key: semgrep-1.160.0-${{ runner.os }}-${{ steps.semgrep-bucket.outputs.iso_week }}
          restore-keys: |
            semgrep-1.160.0-${{ runner.os }}-
      - name: Semgrep
        run: semgrep scan --config p/owasp-top-ten --error

  pip-audit:
    name: SCA - Python (pip-audit)
    runs-on: ubuntu-latest
    needs: changes
    # SCA jobs (pip-audit, npm-audit, trivy) are path-filter gated even
    # though they are security checks - unlike secrets/sast which run
    # unconditionally. Rationale: a docs-only commit cannot introduce a
    # new CVE into the production dependency closure, because lockfiles
    # (`backend/pyproject.toml`, `frontend/package-lock.json`) live under
    # `backend/**` and `frontend/**` respectively. Any dep upgrade that
    # could land a CVE necessarily flips the matching filter and re-runs
    # the audit. Secrets/SAST scan source content (including markdown), so
    # they cannot be path-filtered without losing coverage.
    if: ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install runtime deps
        # Audit only the prod dependency closure - dev tools (pytest, mypy,
        # ruff) never ship to production, so their CVEs would be noise here.
        # The audit action runs in `pip list` mode when `inputs` is omitted,
        # so install the same extras as Dockerfile.prod into an isolated venv.
        run: |
          python -m venv .audit-venv
          . .audit-venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e '.[prod]'
      - name: pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          virtual-environment: backend/.audit-venv
          # PYSEC-2025-183: pyjwt "weak encryption" advisory, DISPUTED by
          # the PyJWT maintainers and has no fix version. The cited risk
          # (short/weak signing key) is the application's choice, not the
          # library's. Mitigated by generating production JWT_SECRET with
          # `python3 -c 'import secrets; print(secrets.token_urlsafe(48))'`
          # (>=32 bytes random) and stored in AWS Secrets Manager.
          # Tracked in #69 - revisit when upstream publishes a fix version
          # or when PyJWT is upgraded to >=3.x.
          ignore-vulns: |
            PYSEC-2025-183

  npm-audit:
    name: SCA - Node (npm audit)
    runs-on: ubuntu-latest
    needs: changes
    # See pip-audit for the rationale on path-filtering an SCA job.
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: npm audit (production deps, high+)
        # --omit=dev mirrors what the production image installs.
        # --audit-level=high blocks HIGH and CRITICAL only; MEDIUM/LOW
        # advisories would be constant noise without a security trade-off.
        run: npm audit --omit=dev --audit-level=high

  trivy:
    name: SCA - Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: changes
    # Trivy reads the lockfiles + Dockerfiles directly; runs when either
    # side changes. Replaces OWASP Dependency-Check, which was 5-10 min
    # slower due to the NVD database download. See pip-audit for the
    # rationale on path-filtering an SCA job.
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Trivy filesystem scan (HIGH + CRITICAL)
        # CVSS 7+ = HIGH/CRITICAL severity, matching the gates used by
        # pip-audit (--audit-level=high) and the old dependency-check
        # (--failOnCVSS 7). Trivy reads pyproject.toml + package-lock.json
        # directly, so it covers the same dependency tree as the per-language
        # audits plus OS packages from Dockerfiles.
        #
        # NO ignore-unfixed: true. OWASP DC blocked on every HIGH/CRITICAL
        # regardless of patch status; Trivy will do the same. Unpatched
        # advisories require explicit suppression with audit notes (mirror
        # the per-CVE allowlist pattern that pip-audit uses for PYSEC-2025-183
        # above) rather than a blanket bypass that grows silently as new
        # zero-days drop before fixes are available.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  sonarqube:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    needs: [changes, backend-coverage-merge, frontend-test]
    # Runs on every event the `changes` gate admits (PR / main push /
    # workflow_dispatch). The two test jobs above are path-filter free, so
    # SonarQube always sees both coverage artifacts and the project-wide
    # coverage trend cannot be distorted by a missing side.
    if: ${{ !cancelled() && needs.backend-coverage-merge.result == 'success' && needs.frontend-test.result == 'success' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Download backend coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-coverage
          path: backend
      - name: Download frontend coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Cache SonarQube analyzers
        # The scanner downloads ~50 MB of language analyzers + JRE on a
        # cold run. Analyzer versions are pinned by the scanner action SHA
        # below; the short-SHA prefix in the cache key bumps the cache
        # automatically when that pin is upgraded so stale analyzers from
        # the previous scanner release cannot be served against a newer
        # engine.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-fd88b7d7
          restore-keys: |
            sonar-${{ runner.os }}-
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # Path-filtered CI gate for the Grafana Cloud dashboard JSONs. Runs on
  # every PR + main push when dashboards change so a malformed dashboard
  # (missing `uid`, invalid JSON) is caught before the real sync below.
  dashboards-validate:
    name: Dashboards - dry-run sync
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.dashboards == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Dry-run dashboard sync (parse + validate, no HTTP)
        run: python scripts/sync_grafana_cloud_dashboards.py --dry-run

  # ─── Deploy pipeline ──────────────────────────────────────────────────────
  # Gated behind every quality + security job above. Runs only on push to
  # main or manual dispatch. Each job carries its own OIDC token grant so
  # the rest of the workflow has no AWS-assume capability.
  build-and-push:
    name: Build and push images to ECR
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend-lint
      - backend-typecheck
      - backend-test
      - frontend
      - frontend-test
      - secrets
      - sast
      - pip-audit
      - npm-audit
      - trivy
    # SonarQube is intentionally NOT in `needs:` so the image build runs in
    # parallel with the SonarQube scan (~1m16s saved on every main deploy).
    # The quality gate is preserved by adding `sonarqube` to the `needs:`
    # of each deploy-side job (migrate-database, deploy-frontend) with an
    # explicit `needs.sonarqube.result == 'success'` check - a SonarQube
    # failure still blocks the ECS rollout, but no longer blocks the image
    # build. Worst case on a SonarQube failure: a single unused image sits
    # in ECR (cents in storage) and is overwritten by the next deploy.
    #
    # always() + !failure() + !cancelled() allows skipped upstream jobs
    # (e.g. the path-filtered `frontend` lint/build job skipped on a
    # backend-only main push) to pass the gate without firing the deploy
    # on docs-only commits. workflow_dispatch
    # is also restricted to main: dispatching from a feature branch must NOT
    # ship un-reviewed code to ECS, even though the dispatch path bypasses
    # the per-side path check (manual hot-fix re-deploys against main need
    # to re-roll both services regardless of what changed in the latest
    # commit).
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
        )
      )
    # Cross-run serialization of image builds for the same branch. The
    # group is `build-` (not `deploy-`) so this lock does NOT block the
    # deploy jobs below - previously they all shared the same `deploy-`
    # group, which serialized backend-deploy behind frontend-deploy
    # within a single run (run 26405726818: deploy-backend waited 1m54s
    # for deploy-frontend to release the lock even though it had no
    # `needs:` on it). cancel-in-progress: false preserves an in-flight
    # build if a newer commit lands.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    outputs:
      backend-image: ${{ steps.meta.outputs.backend-image }}
      frontend-image: ${{ steps.meta.outputs.frontend-image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (OIDC)
        # Federated identity - no AWS_ACCESS_KEY_ID secret. The role's trust
        # policy restricts assumption to this repo + branch (see
        # infra/ecs/README.md). Tokens are short-lived (1 hour default).
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Set up Docker Buildx
        # Buildx enables multi-platform builds and a more efficient cache
        # backend than the legacy builder.
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Build and push backend image
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          # Single immutable :sha-<commit> tag. The previous `:latest` push
          # was a footgun: any ECR lifecycle rule that prunes by tag would
          # reassign and could delete a still-running revision. The task
          # definition pins the deployed image by SHA already, so `:latest`
          # added no operational value.
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACKEND }}:${{ env.IMAGE_TAG }}
          # Layer caching against a sidecar :cache tag - cuts cold-build
          # time from ~5 min to ~1 min on dependency-clean rebuilds.
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACKEND }}:cache
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACKEND }}:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          # Vite inlines build-args, so the API base URL is baked into the
          # bundle. If FE/BE share an ALB with path routing, /api/v1 keeps
          # requests same-origin and avoids CORS entirely.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          # Immutable :sha-<commit> tag only - see backend build comment.
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_FRONTEND }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_FRONTEND }}:cache
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_FRONTEND }}:cache,mode=max

      - name: Expose image URIs to downstream jobs
        id: meta
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          BACKEND_REPO: ${{ vars.ECR_REPOSITORY_BACKEND }}
          FRONTEND_REPO: ${{ vars.ECR_REPOSITORY_FRONTEND }}
        run: |
          echo "backend-image=${REGISTRY}/${BACKEND_REPO}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend-image=${REGISTRY}/${FRONTEND_REPO}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: ECR image scan gate (block CRITICAL/HIGH CVEs)
        # Matches the CVSS >= 7 threshold the source-side SCA jobs use
        # (pip-audit, npm audit --audit-level=high, trivy --severity HIGH,
        # CRITICAL). Scans cover OS packages in the final image - something
        # pip-audit / npm audit cannot see. Requires the ECR repos to have
        # scan-on-push enabled (basic scanning is free; for Inspector /
        # Enhanced, the API surface is the same). Tolerates "scan never
        # started" with a loud warning rather than hanging the workflow,
        # so a misconfigured repo is visible but not a hard outage.
        env:
          BACKEND_REPO: ${{ vars.ECR_REPOSITORY_BACKEND }}
          FRONTEND_REPO: ${{ vars.ECR_REPOSITORY_FRONTEND }}
        run: |
          set -euo pipefail
          check_findings() {
            local repo=$1
            echo "Waiting for scan on ${repo}:${IMAGE_TAG}..."
            if ! aws ecr wait image-scan-complete \
                 --repository-name "$repo" \
                 --image-id "imageTag=${IMAGE_TAG}" 2>/dev/null; then
              echo "::warning::Scan did not start or complete for ${repo}:${IMAGE_TAG} - enable scan-on-push on the repository (aws ecr put-image-scanning-configuration)"
              return 0
            fi
            local findings critical high
            findings=$(aws ecr describe-image-scan-findings \
              --repository-name "$repo" \
              --image-id "imageTag=${IMAGE_TAG}" \
              --query 'imageScanFindings.findingSeverityCounts' \
              --output json)
            echo "${repo} severity counts: ${findings}"
            critical=$(echo "$findings" | jq -r '.CRITICAL // 0')
            high=$(echo "$findings" | jq -r '.HIGH // 0')
            if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
              echo "::error::${repo}:${IMAGE_TAG} has ${critical} CRITICAL and ${high} HIGH findings (gate: block on CVSS >= 7)"
              return 1
            fi
          }
          check_findings "$BACKEND_REPO"
          check_findings "$FRONTEND_REPO"

  migrate-database:
    name: Run migrations (Alembic upgrade)
    needs: [changes, build-and-push, sonarqube]
    runs-on: ubuntu-latest
    # Path-filtered to backend changes only. On a docs- or frontend-only
    # main push there is no new schema to apply, so spinning up a Fargate
    # task just to no-op `alembic upgrade head` wastes ~1-2 min and ECR
    # pull bandwidth - and `deploy-backend` would be skipped anyway by
    # its own backend-side gate. workflow_dispatch forces backend=true
    # via the `changes` aggregate, so manual hot-fixes still migrate.
    #
    # The `always() && needs.<job>.result == 'success'` form is required
    # for the same reason `deploy-backend` carries it (see the long
    # explanation on that job's `if:` below). A bare
    # `if: ((push && main) || dispatch) && needs.changes.outputs.backend == 'true'`
    # compiles to an implicit `success() && ...`, and the implicit
    # success() returns false whenever any transitive ancestor was
    # skipped (e.g. `frontend` / `npm-audit` path-filtered out on a
    # backend-only main push) - even though `build-and-push` itself
    # succeeded via its own `always()` clause. That quirk skipped the
    # whole migrate -> deploy chain on commit 3e9b3dc (PR #100, the
    # OTLP HTTP exporter fix), exactly the symptom PR #81 thought it
    # had eliminated by adding the explicit form to deploy-backend.
    # The fix has to land here too; otherwise every backend-only main
    # push silently no-ops the deploy.
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      needs.sonarqube.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.backend == 'true'
    # Shares `deploy-backend-` with deploy-backend so two queued main
    # pushes never run their migrations concurrently (Alembic forward-
    # only migrations are sequential by design; concurrent runs against
    # the same DB risk lock contention + partial-state corruption).
    # Same group means within a run the migration releases the lock
    # before deploy-backend tries to acquire it, and the per-side
    # split keeps deploy-frontend free to roll in parallel.
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: false
    # Bound the job so a stuck `aws ecs wait tasks-stopped` (or a
    # never-launching task held in PROVISIONING by an ENI shortage)
    # fails the workflow loudly instead of inheriting the 360-min
    # workflow default.
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fill placeholders in backend task definition
        uses: ./.github/actions/render-task-def
        with:
          task-def-path: infra/ecs/backend-task-def.json
          required-vars: |
            ACCOUNT_ID
            REGION
            REPAIR_S3_BUCKET
            DATABASE_URL_SECRET_NAME
            APP_SECRET_NAME
            BOOTSTRAP_MANAGER_EMAIL
            GC_OTLP_ENDPOINT
            GC_PYROSCOPE_ENDPOINT
            GC_SECRET_NAME
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
          REPAIR_S3_BUCKET: ${{ vars.REPAIR_S3_BUCKET }}
          DATABASE_URL_SECRET_NAME: ${{ vars.DATABASE_URL_SECRET_NAME }}
          APP_SECRET_NAME: ${{ vars.APP_SECRET_NAME }}
          BOOTSTRAP_MANAGER_EMAIL: ${{ vars.BOOTSTRAP_MANAGER_EMAIL }}
          GC_OTLP_ENDPOINT: ${{ secrets.GC_OTLP_ENDPOINT }}
          GC_PYROSCOPE_ENDPOINT: ${{ secrets.GC_PYROSCOPE_ENDPOINT }}
          GC_SECRET_NAME: ${{ vars.GC_SECRET_NAME }}

      - name: Render migration task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@d76864cb7cfd35d95ee4e9dceac89be22175b493 # v1.8.5
        with:
          task-definition: infra/ecs/backend-task-def.json
          container-name: backend
          image: ${{ needs.build-and-push.outputs.backend-image }}

      - name: Run migration task
        # Executes `alembic upgrade head` as a one-off task using the new
        # image. Blocks until the task stops. If it fails (exit code != 0
        # or the container never reached STOPPED cleanly) this job fails
        # and `deploy-backend` is skipped — preventing the app from
        # booting against an old schema. Forward-only: rollback to a
        # prior schema needs a manual revert migration.
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_MIGRATION_SUBNETS: ${{ vars.ECS_MIGRATION_SUBNETS }}
          ECS_MIGRATION_SECURITY_GROUPS: ${{ vars.ECS_MIGRATION_SECURITY_GROUPS }}
          TASK_DEFINITION: ${{ steps.render.outputs.task-definition }}
        run: |
          set -euo pipefail
          # Fail fast on missing infra vars. The previous fallback to
          # hardcoded subnet / security-group IDs leaked VPC topology into
          # source control AND silently routed migrations into a VPC that
          # might not match ECS_CLUSTER. Matches the `required-vars` posture
          # used by the render-task-def action above.
          if [ -z "${ECS_MIGRATION_SUBNETS}" ] || [ -z "${ECS_MIGRATION_SECURITY_GROUPS}" ]; then
            echo "::error::ECS_MIGRATION_SUBNETS and ECS_MIGRATION_SECURITY_GROUPS must be set as Repository Variables (JSON arrays). See infra/ecs/README.md."
            exit 1
          fi
          # Shape check: a CSV ("subnet-abc,subnet-def") would silently produce
          # broken JSON at jq -cn time and a downstream aws-cli error message
          # that doesn't name the variable. Refuse early with a clear pointer.
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"${ECS_MIGRATION_SUBNETS}"; then
            echo "::error::ECS_MIGRATION_SUBNETS must be a JSON array (got: ${ECS_MIGRATION_SUBNETS})"
            exit 1
          fi
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"${ECS_MIGRATION_SECURITY_GROUPS}"; then
            echo "::error::ECS_MIGRATION_SECURITY_GROUPS must be a JSON array (got: ${ECS_MIGRATION_SECURITY_GROUPS})"
            exit 1
          fi
          network_config=$(jq -cn \
            --argjson subnets "${ECS_MIGRATION_SUBNETS}" \
            --argjson sgs "${ECS_MIGRATION_SECURITY_GROUPS}" \
            '{awsvpcConfiguration: {subnets: $subnets, securityGroups: $sgs, assignPublicIp: "DISABLED"}}')
          # Register the rendered task definition and capture the new ARN.
          # `aws-actions/amazon-ecs-render-task-definition` outputs a *file
          # path* (e.g. /home/runner/work/_temp/task-definition-...json), not
          # a registered family or ARN. `aws ecs run-task --task-definition`
          # accepts only family / family:revision / ARN -- passing the path
          # directly fails with `family must match ^[a-zA-Z0-9\-_]+$` on the
          # slashes. `deploy-backend` works because its deploy action calls
          # RegisterTaskDefinition internally; `run-task` has no such wrapper.
          task_def_arn=$(aws ecs register-task-definition \
            --cli-input-json "file://${TASK_DEFINITION}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered migration task definition: $task_def_arn"
          # Capture the full run-task JSON so we can inspect `failures[]`.
          # ECS returns HTTP 200 with `tasks: []` and a populated `failures[]`
          # whenever it cannot launch (capacity-provider exhaustion, ENI
          # shortage, IAM denial, image pull at launch time). The previous
          # `--query 'tasks[0].taskArn' --output text` would emit the literal
          # string "None" and `aws ecs wait` would then fail with an opaque
          # "task not found" instead of the real reason.
          run_task_output=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${task_def_arn}" \
            --launch-type FARGATE \
            --network-configuration "${network_config}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}' \
            --output json)
          if [ "$(jq '.failures | length' <<<"$run_task_output")" -gt 0 ]; then
            failures_compact=$(jq -c '.failures' <<<"$run_task_output")
            echo "::error::run-task could not launch the migration task. failures: ${failures_compact}"
            exit 1
          fi
          task_arn=$(jq -r '.tasks[0].taskArn' <<<"$run_task_output")
          echo "Migration task ARN: $task_arn"
          # `wait || true` so a wait timeout (PROVISIONING → STOPPED stalled
          # past the waiter's 100×6s budget) or a TaskFailedToStart status
          # falls through to the describe-tasks dump below. `set -e` would
          # otherwise abort here and the operator would see a bare
          # "Max attempts exceeded" with no stoppedReason, containerReason,
          # or task ARN — exactly the diagnostic gap this script exists to close.
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "$task_arn" || true
          task_state=$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "$task_arn" --output json)
          last_status=$(jq -r '.tasks[0].lastStatus // "UNKNOWN"' <<<"$task_state")
          exit_code=$(jq -r '.tasks[0].containers[0].exitCode // "null"' <<<"$task_state")
          stopped_reason=$(jq -r '.tasks[0].stoppedReason // "none"' <<<"$task_state")
          container_reason=$(jq -r '.tasks[0].containers[0].reason // "none"' <<<"$task_state")
          echo "Migration task final state: lastStatus=${last_status} exitCode=${exit_code} stoppedReason=${stopped_reason} containerReason=${container_reason}"
          if [ "$last_status" != "STOPPED" ] || [ "$exit_code" != "0" ]; then
            # exitCode is null when the container never started (Secrets
            # Manager fetch, image pull, ENI shortage). The CloudWatch log
            # stream is also absent in that case — stoppedReason and
            # containerReason printed above are the only diagnostic surface.
            echo "::error::Migration failed. lastStatus=${last_status} exitCode=${exit_code} stoppedReason=${stopped_reason} containerReason=${container_reason}. Check CloudWatch logs for task $task_arn."
            exit 1
          fi

  deploy-backend:
    name: Deploy backend (ECS rolling update)
    needs: [changes, build-and-push, migrate-database]
    runs-on: ubuntu-latest
    # Per-side gate: only roll the backend task when backend code actually
    # changed in this run (or on a manual hot-fix dispatch, which forces
    # both `changes` outputs to true). On a frontend-only main push the
    # backend image is still rebuilt (deterministically, from unchanged
    # source) but ECS keeps serving the previous task revision instead of
    # rolling a no-op deploy.
    #
    # The `always() && needs.<job>.result == 'success'` form is deliberate:
    # a bare `if: needs.changes.outputs.backend == 'true'` compiles to an
    # implicit `success() && ...`, and that success() returns false when
    # build-and-push had any skipped need (e.g. backend-lint skipped on a
    # frontend-only push) — even though build-and-push itself succeeded via
    # its own always() clause. That quirk silently skipped every single-side
    # main deploy between PR #81 and this fix.
    #
    # The explicit `build-and-push.result == 'success'` check (not just
    # `!contains(failure)`) is what cascades the skip from build-and-push
    # down on PR / docs-only runs — `skipped` is neither failure nor success,
    # so a permissive `!contains(failure/cancelled)` would let the deploy
    # run on PRs with no image to deploy. Same for migrate-database: it
    # owns the main+backend gate and a failed migration MUST block deploy.
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      needs.migrate-database.result == 'success' &&
      needs.changes.outputs.backend == 'true'
    # Per-service concurrency: backend-side jobs (migrate-database +
    # deploy-backend) share `deploy-backend-` so they serialize cross-run
    # but DO NOT block deploy-frontend (different group). This unblocks
    # within-run parallelism that the prior single `deploy-` group was
    # silently breaking - see build-and-push's comment above for the
    # symptom this fixes.
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fill placeholders in backend task definition
        uses: ./.github/actions/render-task-def
        with:
          task-def-path: infra/ecs/backend-task-def.json
          required-vars: |
            ACCOUNT_ID
            REGION
            REPAIR_S3_BUCKET
            DATABASE_URL_SECRET_NAME
            APP_SECRET_NAME
            BOOTSTRAP_MANAGER_EMAIL
            GC_OTLP_ENDPOINT
            GC_PYROSCOPE_ENDPOINT
            GC_SECRET_NAME
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
          REPAIR_S3_BUCKET: ${{ vars.REPAIR_S3_BUCKET }}
          DATABASE_URL_SECRET_NAME: ${{ vars.DATABASE_URL_SECRET_NAME }}
          APP_SECRET_NAME: ${{ vars.APP_SECRET_NAME }}
          BOOTSTRAP_MANAGER_EMAIL: ${{ vars.BOOTSTRAP_MANAGER_EMAIL }}
          # The Grafana Cloud OTLP + Pyroscope endpoint URLs are read
          # from ``secrets.*`` rather than ``vars.*`` because they
          # embed the GC stack slug / region. The slug + a leaked GC
          # API key would narrow an attacker's target identification.
          # Endpoint URLs are not themselves credentials, but treating
          # them as defense-in-depth secrets costs nothing operationally
          # (operator sets one value in repo settings) and removes a
          # half-credential from public-repo visibility.
          GC_OTLP_ENDPOINT: ${{ secrets.GC_OTLP_ENDPOINT }}
          GC_PYROSCOPE_ENDPOINT: ${{ secrets.GC_PYROSCOPE_ENDPOINT }}
          GC_SECRET_NAME: ${{ vars.GC_SECRET_NAME }}

      - name: Render backend task definition
        # Patches the container image into the committed task-def template.
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@d76864cb7cfd35d95ee4e9dceac89be22175b493 # v1.8.5
        with:
          task-definition: infra/ecs/backend-task-def.json
          container-name: backend
          image: ${{ needs.build-and-push.outputs.backend-image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@817071763d92bbe2ae01a5ec32f1d999dd2293a0 # v2.1.0
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_BACKEND }}
          cluster: ${{ vars.ECS_CLUSTER }}
          # Block until the new task set passes ALB health checks. Without
          # this the workflow would return success while the new task is
          # crash-looping and the old image is still serving traffic.
          wait-for-service-stability: true
          # 10 min covers cold-start + slow ALB drain. If a deploy stalls
          # past this, fail loud rather than hang the workflow.
          wait-for-minutes: 10

  deploy-frontend:
    name: Deploy frontend (ECS rolling update)
    needs: [changes, build-and-push, sonarqube]
    runs-on: ubuntu-latest
    # Per-side gate: see deploy-backend for the same rationale, including
    # why the explicit `build-and-push.result == 'success'` check (rather
    # than `!contains(failure/cancelled)`) is what keeps PR runs from
    # rolling a deploy with no image to ship.
    #
    # `sonarqube` is now a direct dependency (previously it gated
    # build-and-push, which transitively gated this job). Decoupled so
    # the image build can run in parallel with the SonarQube scan; the
    # quality gate is preserved by checking `sonarqube.result == 'success'`
    # here. deploy-backend inherits the gate via migrate-database.
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      needs.sonarqube.result == 'success' &&
      needs.changes.outputs.frontend == 'true'
    # Per-service concurrency: see deploy-backend above. Separate group
    # from `deploy-backend-` so the two services can roll in parallel
    # within a run.
    concurrency:
      group: deploy-frontend-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fill placeholders in frontend task definition
        uses: ./.github/actions/render-task-def
        with:
          task-def-path: infra/ecs/frontend-task-def.json
          required-vars: |
            ACCOUNT_ID
            REGION
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}

      - name: Render frontend task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@d76864cb7cfd35d95ee4e9dceac89be22175b493 # v1.8.5
        with:
          task-definition: infra/ecs/frontend-task-def.json
          container-name: frontend
          image: ${{ needs.build-and-push.outputs.frontend-image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@817071763d92bbe2ae01a5ec32f1d999dd2293a0 # v2.1.0
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_FRONTEND }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

  # DESTRUCTIVE: wipes all four core tables and re-seeds demo data. Only
  # fires on workflow_dispatch with the `run_seed` input ticked; never on
  # push events. Runs after `deploy-backend` so the freshly seeded data
  # matches the schema of the running image. The container image gates
  # the seed script behind AMS_SEED_CONFIRM=1 (see CLAUDE.md §"Local dev
  # environment"); this job sets that env override explicitly so a stray
  # re-run of the rendered task definition can never accidentally re-seed.
  seed-database:
    name: Seed demo data (DESTRUCTIVE)
    # `deploy-backend` is in `needs:` so the seed runs against the
    # already-rolled-out task set — the freshly seeded rows therefore land
    # while the new code is serving traffic, not while the previous image
    # is still on the ALB. Note this implies the seed can ONLY fire on a
    # workflow_dispatch event: `deploy-backend` is gated on
    # `changes.outputs.backend == 'true'` which is forced to `true` on
    # workflow_dispatch (see the `changes` job's aggregate step), so the
    # backend deploys unconditionally on dispatch. On a `push` event,
    # deploy-backend may be skipped (frontend-only commit) and `needs:`
    # would silently skip this job too — but the `if:` guard below
    # already restricts the trigger to workflow_dispatch with run_seed
    # ticked, so the silent-skip path is unreachable in practice.
    needs: [changes, build-and-push, migrate-database, deploy-backend]
    runs-on: ubuntu-latest
    # `inputs.run_seed` is declared `type: boolean` and reaches the
    # workflow as an actual boolean (true / false), not the string
    # 'true' / 'false'. Comparing against the string 'true' silently
    # evaluates false: GH's loose-equality coercion rules turn the
    # boolean side into a number (true -> 1) and the string side into
    # a number too (non-numeric strings -> NaN), and `NaN == 1` is
    # always false. So `inputs.run_seed == 'true'` is unreachable
    # regardless of whether the operator ticks the box, and the job
    # silently skips with no annotation. (Symptom: dispatch run
    # 26410291386 on 2026-05-25 - operator ticked run_seed, job
    # showed "Seed demo data (DESTRUCTIVE)" as skipped, deploys
    # succeeded.) The prior comment in this block claimed boolean
    # inputs arrive as strings; that's wrong - confirmed empirically
    # against current GH Actions behavior. Compare against the
    # boolean literal `true` instead.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed == true }}
    # Same bound as migrate-database. The seed itself completes in seconds
    # but `aws ecs wait tasks-stopped` can poll for ~10 min before failing
    # loudly if the task hangs.
    timeout-minutes: 15
    # Second-factor gate on top of the in-script AMS_SEED_CONFIRM=1 check.
    # Required reviewers configured on the `production-destructive`
    # environment (Settings → Environments) must approve before this job
    # starts. Without that one-checkbox approval in the dispatch UI is
    # enough to wipe production data; with it, the operator who clicks
    # `Run workflow` cannot also self-approve the job.
    #
    # The environment is referenced by name only; if it does not yet
    # exist in repo settings the job runs without the protection (GitHub
    # auto-creates an unprotected environment on first reference). Add
    # required reviewers in Settings before relying on the gate.
    environment: production-destructive
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fill placeholders in backend task definition
        uses: ./.github/actions/render-task-def
        with:
          task-def-path: infra/ecs/backend-task-def.json
          required-vars: |
            ACCOUNT_ID
            REGION
            REPAIR_S3_BUCKET
            DATABASE_URL_SECRET_NAME
            APP_SECRET_NAME
            BOOTSTRAP_MANAGER_EMAIL
            GC_OTLP_ENDPOINT
            GC_PYROSCOPE_ENDPOINT
            GC_SECRET_NAME
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
          REPAIR_S3_BUCKET: ${{ vars.REPAIR_S3_BUCKET }}
          DATABASE_URL_SECRET_NAME: ${{ vars.DATABASE_URL_SECRET_NAME }}
          APP_SECRET_NAME: ${{ vars.APP_SECRET_NAME }}
          BOOTSTRAP_MANAGER_EMAIL: ${{ vars.BOOTSTRAP_MANAGER_EMAIL }}
          GC_OTLP_ENDPOINT: ${{ secrets.GC_OTLP_ENDPOINT }}
          GC_PYROSCOPE_ENDPOINT: ${{ secrets.GC_PYROSCOPE_ENDPOINT }}
          GC_SECRET_NAME: ${{ vars.GC_SECRET_NAME }}

      - name: Render seed task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@d76864cb7cfd35d95ee4e9dceac89be22175b493 # v1.8.5
        with:
          task-definition: infra/ecs/backend-task-def.json
          container-name: backend
          image: ${{ needs.build-and-push.outputs.backend-image }}

      - name: Run seed task
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_MIGRATION_SUBNETS: ${{ vars.ECS_MIGRATION_SUBNETS }}
          ECS_MIGRATION_SECURITY_GROUPS: ${{ vars.ECS_MIGRATION_SECURITY_GROUPS }}
          TASK_DEFINITION: ${{ steps.render.outputs.task-definition }}
        run: |
          set -euo pipefail
          if [ -z "${ECS_MIGRATION_SUBNETS}" ] || [ -z "${ECS_MIGRATION_SECURITY_GROUPS}" ]; then
            echo "::error::ECS_MIGRATION_SUBNETS and ECS_MIGRATION_SECURITY_GROUPS must be set as Repository Variables (JSON arrays). See infra/ecs/README.md."
            exit 1
          fi
          # Shape check — see migrate-database for the rationale.
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"${ECS_MIGRATION_SUBNETS}"; then
            echo "::error::ECS_MIGRATION_SUBNETS must be a JSON array (got: ${ECS_MIGRATION_SUBNETS})"
            exit 1
          fi
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"${ECS_MIGRATION_SECURITY_GROUPS}"; then
            echo "::error::ECS_MIGRATION_SECURITY_GROUPS must be a JSON array (got: ${ECS_MIGRATION_SECURITY_GROUPS})"
            exit 1
          fi
          network_config=$(jq -cn \
            --argjson subnets "${ECS_MIGRATION_SUBNETS}" \
            --argjson sgs "${ECS_MIGRATION_SECURITY_GROUPS}" \
            '{awsvpcConfiguration: {subnets: $subnets, securityGroups: $sgs, assignPublicIp: "DISABLED"}}')
          # AMS_SEED_CONFIRM=1 is the in-script safety gate (see
          # scripts/seed_demo_data.py). The seed will abort without it
          # even when invoked directly. Set as an env override here so
          # the rendered task definition stays unchanged from the one
          # `deploy-backend` registered. (containerOverrides.environment
          # is additive, not replacing — the task-def env block survives.)
          overrides=$(jq -cn '{
            containerOverrides: [{
              name: "backend",
              command: ["python", "scripts/seed_demo_data.py"],
              environment: [{name: "AMS_SEED_CONFIRM", value: "1"}]
            }]
          }')
          # Register the rendered task definition first -- see migrate-database
          # for the full rationale (render action outputs a file path, not a
          # family/ARN, so `run-task --task-definition` rejects it on the
          # slashes with `family must match ^[a-zA-Z0-9\-_]+$`).
          task_def_arn=$(aws ecs register-task-definition \
            --cli-input-json "file://${TASK_DEFINITION}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered seed task definition: $task_def_arn"
          # Capture run-task JSON to inspect failures[]. See migrate-database
          # for the rationale on why `--query 'tasks[0].taskArn' --output text`
          # is unsafe (silent "None" task ARN swallows ECS launch failures).
          run_task_output=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${task_def_arn}" \
            --launch-type FARGATE \
            --network-configuration "${network_config}" \
            --overrides "${overrides}" \
            --output json)
          if [ "$(jq '.failures | length' <<<"$run_task_output")" -gt 0 ]; then
            failures_compact=$(jq -c '.failures' <<<"$run_task_output")
            echo "::error::run-task could not launch the seed task. failures: ${failures_compact}"
            exit 1
          fi
          task_arn=$(jq -r '.tasks[0].taskArn' <<<"$run_task_output")
          echo "Seed task ARN: $task_arn"
          # `wait || true` + unconditional describe — same rationale as
          # migrate-database. A wait timeout or TaskFailedToStart must still
          # surface stoppedReason / containerReason on the failure path.
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "$task_arn" || true
          task_state=$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "$task_arn" --output json)
          last_status=$(jq -r '.tasks[0].lastStatus // "UNKNOWN"' <<<"$task_state")
          exit_code=$(jq -r '.tasks[0].containers[0].exitCode // "null"' <<<"$task_state")
          stopped_reason=$(jq -r '.tasks[0].stoppedReason // "none"' <<<"$task_state")
          container_reason=$(jq -r '.tasks[0].containers[0].reason // "none"' <<<"$task_state")
          echo "Seed task final state: lastStatus=${last_status} exitCode=${exit_code} stoppedReason=${stopped_reason} containerReason=${container_reason}"
          if [ "$last_status" != "STOPPED" ] || [ "$exit_code" != "0" ]; then
            echo "::error::Seed failed. lastStatus=${last_status} exitCode=${exit_code} stoppedReason=${stopped_reason} containerReason=${container_reason}. Check CloudWatch logs for task $task_arn."
            exit 1
          fi

  # CD: upsert the dashboard JSONs into Grafana Cloud on every main commit
  # that touches the dashboard set. Blocks on failure - a half-applied
  # dashboard tree silently drifts from the repo, which is the failure
  # mode that motivated automating this. Independent of the ECS deploys:
  # a dashboards-only commit does not roll backend/frontend, and a
  # backend/frontend-only commit does not re-sync dashboards.
  #
  # GC_STACK_URL is the stack URL (https://<slug>.grafana.net), NOT the
  # OTLP gateway URL already configured for backend telemetry - the
  # dashboards-DB API lives on the stack, not the gateway. Stored as a
  # secret (not a variable) for the same defense-in-depth reason as
  # GC_OTLP_ENDPOINT: the slug + a leaked GC API key would narrow an
  # attacker's target identification.
  sync-dashboards:
    name: Sync dashboards to Grafana Cloud
    runs-on: ubuntu-latest
    needs: [changes, dashboards-validate]
    # Main-only gate mirrors `build-and-push`: dispatching from a feature
    # branch must NOT mutate the production GC stack. The validate job is
    # in `needs:` so a malformed JSON catches before the real upsert; if
    # validate fails (or is skipped because dashboards didn't change) the
    # `!failure() + (dashboards == 'true')` clause keeps the sync from
    # firing.
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.changes.outputs.dashboards == 'true')
      )
    concurrency:
      group: sync-dashboards-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Sync dashboards to Grafana Cloud
        # Script is stdlib only - no pip install. Reads GRAFANA_CLOUD_API_KEY
        # from env; --stack-url is passed via env indirection to keep the
        # `${{ ... }}` expression out of the shell command (no injection
        # surface even though both inputs are operator-controlled secrets).
        env:
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          GC_STACK_URL: ${{ secrets.GC_STACK_URL }}
          # Stack-specific UID for the AWS CloudWatch datasource; the
          # sync script substitutes it for the `cloudwatch` placeholder
          # the dashboard JSONs use. See infra/grafana-cloud/README.md.
          GC_CLOUDWATCH_UID: ${{ vars.GC_CLOUDWATCH_UID }}
        run: python scripts/sync_grafana_cloud_dashboards.py --stack-url "$GC_STACK_URL"
