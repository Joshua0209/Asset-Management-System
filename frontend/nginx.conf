# nginx config for the production frontend image.
#
# Caching strategy follows Vite's hashed-filename convention: bundles
# under /assets/ are content-hashed and safe to cache for a year, while
# /index.html must stay fresh so deploys propagate immediately.

# log_format is an http-context directive. This file is mounted to
# /etc/nginx/conf.d/default.conf, which the stock nginx.conf includes
# inside http {}, so top-level directives here run at http scope.
# $request_time is in seconds; dashboards multiply by 1000 to display ms.
#
# $upstream_response_time emits the literal '-' for responses with no
# upstream (every static-asset request from /assets/). Quoting the
# field would land a "-" string in Loki, mixing types with the numeric
# branch and type-erroring any LogQL `| json | unwrap upstream_time`
# pipeline. Normalise it to a numeric 0 via a map so the field is
# always JSON-number-compatible and never a placeholder string.
map $upstream_response_time $ams_upstream_time {
    default $upstream_response_time;
    "-"     0;
    ""      0;
}

log_format json_combined escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_time":$ams_upstream_time'
    '}';

server {
    listen       80;
    server_name  _;

    # nginx:alpine already symlinks /var/log/nginx/{access,error}.log to
    # /dev/stdout and /dev/stderr, so emitting JSON here lands directly on
    # the container's stdout — in production the ECS task definition ships
    # those lines to CloudWatch Logs, which Grafana Cloud's hosted
    # CloudWatch Logs integration ingests into Loki. No Alloy / no agent
    # in the data path; locked decision #2 of the prod migration plan.
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # SPA fallback — deep links resolve to index.html, which boots React
    # and lets the client router take over.
    root   /usr/share/nginx/html;
    index  index.html;

    # ------------------------------------------------------------------
    # Security response headers. nginx ``add_header`` is inherited ONLY
    # when the child block declares no ``add_header`` of its own — so
    # every ``location`` below that needs ``Cache-Control`` MUST repeat
    # this stanza, otherwise the security headers silently disappear on
    # those paths. The ``always`` flag emits them on 4xx/5xx responses
    # too, which is where clickjacking / MIME-sniff probes hit hardest.
    #
    # CSP scoped for the Vite production bundle:
    #   * ``default-src 'self'`` — single-origin fallback for anything
    #     not enumerated below.
    #   * ``script-src 'self'`` — Vite emits hash-named bundles under
    #     /assets/; no inline <script> in index.html.
    #   * ``style-src 'self' 'unsafe-inline'`` — Ant Design v6 + emotion
    #     inject runtime CSS-in-JS via <style> tags, so hash/nonce-only
    #     CSP would break the UI. ``unsafe-inline`` is restricted to
    #     style-src; script-src stays tight.
    #   * ``img-src 'self' data: blob:`` — uploaded repair images may
    #     be served as blob URLs; antd icons inline as data: URLs.
    #   * ``font-src 'self'`` — self-hosted only (no Google Fonts).
    #   * ``connect-src 'self'`` — covers same-origin XHR / fetch /
    #     OTel browser-SDK exports. Split-origin deploys MUST override
    #     this via a deploy-time substitution to add the backend +
    #     OTLP endpoints (e.g. via ``envsubst`` in entrypoint.sh); the
    #     existing ``VITE_API_BASE_URL`` operator workflow already
    #     accepts split-origin so this is the only header that may
    #     need per-env adjustment.
    #   * ``frame-ancestors 'none'`` — supersedes X-Frame-Options on
    #     modern browsers but we keep both for legacy coverage.
    #   * ``form-action 'self'`` — blocks an attacker-controlled <form
    #     action="https://evil.com">.
    #   * ``base-uri 'self'`` — prevents <base href> hijack.
    #   * ``object-src 'none'`` — no <object>/<embed>/<applet>.
    set $ams_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'";
    set $ams_permissions_policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()";

    # Hashed bundles are immutable; cache aggressively.
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $ams_csp always;
        add_header Permissions-Policy $ams_permissions_policy always;
        try_files  $uri =404;
    }

    # index.html must never be cached — it's how clients discover the new
    # bundle hash after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $ams_csp always;
        add_header Permissions-Policy $ams_permissions_policy always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $ams_csp always;
        add_header Permissions-Policy $ams_permissions_policy always;
        try_files $uri $uri/ /index.html;
    }

    # Hide nginx version in error pages and headers.
    server_tokens off;
}
